# PacketScreen messages (English).
# Color codes use & (for example &a) and &#RRGGBB on 1.16+ servers (older servers use the closest legacy color).
# {prefix} inserts the prefix below. Other placeholders are listed next to the messages that use them.

prefix: "&8[&bPacketScreen&8] &7"

no-permission: "{prefix}&cYou don't have permission to do that."
players-only: "{prefix}&cOnly players can use this form of the command. Add coordinates to use it from the console."
unknown-command: "{prefix}&cUnknown subcommand. Use &f/{label} help&c."
cooldown: "{prefix}&cPlease wait a moment before using this command again."

invalid-name: "{prefix}&cInvalid name &f{value}&c. Use 1-32 letters, numbers, - or _."
screen-exists: "{prefix}&cA screen named &f{name}&c already exists."
screen-overlap: "{prefix}&cThat position overlaps the screen &f{name}&c. Choose another position or move that screen first."
source-is-video: "{prefix}&cThat source is a video. Use &f/{label} video {name} <url>&c for video screens."
source-is-image: "{prefix}&cThat source is an image. Use &f/{label} create {name} <url>&c for image screens."
screen-not-found: "{prefix}&cThe screen &f{name}&c does not exist."
screen-limit: "{prefix}&cThe screen limit (&f{max}&c) has been reached."
video-limit: "{prefix}&cThe limit of simultaneous videos (&f{max}&c) has been reached. Stop another video first."
invalid-url: "{prefix}&cInvalid URL. Use a direct http:// or https:// link to the file."
invalid-number: "{prefix}&c&f{value}&c is not a valid number."
invalid-size: "{prefix}&cInvalid size &f{value}&c. Use a positive number of blocks, for example 4 or 2.25."
size-out-of-bounds: "{prefix}&cThe size must be between &f{min}&c and &f{max-width} x {max-height}&c blocks."
invalid-fit-mode: "{prefix}&cInvalid fit mode &f{value}&c. Use FIT, FILL or STRETCH."
invalid-aspect: "{prefix}&cUse &fpreserve&c or &ffree&c."
invalid-resolution: "{prefix}&cInvalid resolution. Use a width, a width and a height, or &fauto&c."
resolution-out-of-bounds: "{prefix}&cThe processing resolution must be between &f16 x 16&c and &f{max-width} x {max-height}&c."
invalid-fps: "{prefix}&cThe FPS must be a whole number between &f1&c and &f{max}&c."
invalid-boolean: "{prefix}&cUse &ftrue&c or &ffalse&c."
invalid-rotation: "{prefix}&cThe rotation must be &f0&c, &f90&c, &f180&c or &f270&c."
invalid-facing: "{prefix}&cInvalid facing &f{value}&c. Use north, south, east, west, up or down."
invalid-range: "{prefix}&cThe view distance must be between &f4&c and &f{max}&c blocks."
invalid-world: "{prefix}&cThe world &f{value}&c does not exist."
world-required: "{prefix}&cA world name is required when the command is used from the console."
no-target-block: "{prefix}&cLook at a solid block within &f{distance}&c blocks, or provide coordinates."
compatibility-error: "{prefix}&cThis server version (&f{version}&c) does not support {feature}."
not-a-video: "{prefix}&cThe screen &f{name}&c is not a video screen."

screen-created: "{prefix}&aImage screen &f{name}&a created. Loading the image..."
video-created: "{prefix}&aVideo screen &f{name}&a created."
image-ready: "{prefix}&aScreen &f{name}&a is ready: &f{source}&a shown on &f{width} x {height}&a blocks."
animation-ready: "{prefix}&aScreen &f{name}&a is ready: &f{source}&a animation with &f{frames}&a frames playing on &f{width} x {height}&a blocks."
load-failed: "{prefix}&cCould not load the image of &f{name}&c: {reason}"
screen-removed: "{prefix}&aScreen &f{name}&a removed."
resized: "{prefix}&aScreen &f{name}&a resized to &f{width} x {height}&a blocks (&f{mode}&a)."
scaled: "{prefix}&aScreen &f{name}&a scaled by &f{factor}&a to &f{width} x {height}&a blocks."
aspect-preserve: "{prefix}&aScreen &f{name}&a now preserves the original aspect ratio."
aspect-free: "{prefix}&aScreen &f{name}&a now uses free width and height."
resolution-set: "{prefix}&aProcessing resolution of &f{name}&a set to &f{width} x {height}&a pixels."
resolution-auto: "{prefix}&aProcessing resolution of &f{name}&a is now automatic."
fps-set: "{prefix}&aFPS of &f{name}&a set to &f{fps}&a."
loop-set: "{prefix}&aLoop of &f{name}&a set to &f{loop}&a."
moved: "{prefix}&aScreen &f{name}&a moved to &f{world} {x}, {y}, {z}&a facing &f{facing}&a."
rotated: "{prefix}&aScreen &f{name}&a rotated to &f{rotation}&a degrees."
range-set: "{prefix}&aView distance of &f{name}&a set to &f{range}&a blocks."
hologram-set: "{prefix}&aHologram mode of &f{name}&a set to &f{value}&a. The screen turns to face each player."
url-changed: "{prefix}&aSource of &f{name}&a changed. Loading..."
refreshing: "{prefix}&aReloading the source of &f{name}&a..."

video-loading: "{prefix}&eDownloading and preparing the video of &f{name}&e..."
video-started: "{prefix}&aVideo &f{name}&a is playing (&f{source}&a at &f{fps}&a FPS)."
video-paused: "{prefix}&eVideo &f{name}&e paused."
video-resumed: "{prefix}&aVideo &f{name}&a resumed."
video-stopped: "{prefix}&7Video &f{name}&7 stopped."
video-restarted: "{prefix}&aVideo &f{name}&a restarted."
video-ended: "{prefix}&7Video &f{name}&7 reached the end."
video-not-playing: "{prefix}&cThe video &f{name}&c is not playing."
video-already-playing: "{prefix}&cThe video &f{name}&c is already playing."
video-failed: "{prefix}&cCould not play the video of &f{name}&c: {reason}"
ffmpeg-missing: "{prefix}&cFFmpeg was not found at &f{path}&c. Install FFmpeg or set video.ffmpeg-path in config.yml."

upload-not-found: "{prefix}&cThe upload &f{value}&c does not exist. Upload files in the web panel with /{label} web."
web-disabled: "{prefix}&cThe web panel is disabled. Set web.enabled to true in config.yml and run /{label} reload."
web-unavailable: "{prefix}&cThe web panel requires Java 17 or newer. This server runs Java {java}."
web-not-running: "{prefix}&cThe web panel is not running ({error}). Check the console and the web settings in config.yml."
web-link: "{prefix}&aWeb panel link (single use, valid for {minutes} min): &f&n{url}"
web-revoked: "{prefix}&aEvery web panel link and session was revoked."

reload-done: "{prefix}&aConfiguration and messages reloaded."
reload-failed: "{prefix}&cThe configuration could not be reloaded: &f{error}"

features:
  floor-screens: "screens on floors and ceilings (requires 1.13 or newer)"

reasons:
  invalid-url: "the URL is not valid"
  blocked-address: "the address is not allowed"
  network: "network error ({detail})"
  timeout: "the request timed out"
  too-large: "the file is larger than {max}"
  http-status: "the server answered HTTP {status}"
  too-many-redirects: "too many redirects"
  web-page: "the URL points to a web page, not to a direct file"
  unsupported-format: "the format is not supported"
  frames: "the animation has {frames} frames, the limit is {max}"
  video-source: "the file is a video, use the video command"
  image-source: "the file is an image, use the create command"
  resolution: "the resolution {width} x {height} is above the limit"
  duration: "the video is longer than {max} seconds"
  decode: "the file could not be decoded"
  ffmpeg-missing: "FFmpeg is not available"
  map-ids: "there are no free map ids left (increase rendering.map-id range)"
  missing: "the uploaded file no longer exists"
  storage-full: "the upload storage is full ({max})"
  cancelled: "the operation was cancelled"
  internal: "internal error ({detail})"

usage:
  create: "{prefix}&eUsage: &f/{label} create <name> <url> [width height] [x y z [facing] [world]]"
  video: "{prefix}&eUsage: &f/{label} video <name> <url> [width height] [x y z [facing] [world]]"
  url: "{prefix}&eUsage: &f/{label} url <name> <url>"
  refresh: "{prefix}&eUsage: &f/{label} refresh <name>"
  resize: "{prefix}&eUsage: &f/{label} resize <name> <width> <height> [FIT|FILL|STRETCH]"
  scale: "{prefix}&eUsage: &f/{label} scale <name> <factor>"
  aspect: "{prefix}&eUsage: &f/{label} aspect <name> <preserve|free>"
  resolution: "{prefix}&eUsage: &f/{label} resolution <name> <width> [height] &7or &f/{label} resolution <name> auto"
  fps: "{prefix}&eUsage: &f/{label} fps <name> <value>"
  play: "{prefix}&eUsage: &f/{label} play <name>"
  pause: "{prefix}&eUsage: &f/{label} pause <name>"
  stop: "{prefix}&eUsage: &f/{label} stop <name>"
  restart: "{prefix}&eUsage: &f/{label} restart <name>"
  loop: "{prefix}&eUsage: &f/{label} loop <name> <true|false>"
  hologram: "{prefix}&eUsage: &f/{label} hologram <name> <true|false>"
  move: "{prefix}&eUsage: &f/{label} move <name> [x y z [facing] [world]]"
  rotate: "{prefix}&eUsage: &f/{label} rotate <name> <0|90|180|270>"
  range: "{prefix}&eUsage: &f/{label} range <name> <blocks>"
  remove: "{prefix}&eUsage: &f/{label} remove <name>"
  list: "{prefix}&eUsage: &f/{label} list"
  info: "{prefix}&eUsage: &f/{label} info <name>"
  reload: "{prefix}&eUsage: &f/{label} reload"
  web: "{prefix}&eUsage: &f/{label} web &7or &f/{label} web revoke"

help:
  header: "&8&m-------&r &bPacketScreen &7v{version} &8&m-------"
  footer: "&7Sizes are in blocks and may be fractional. Screens are anchored at their bottom-left block."
  commands:
    create: "&f/{label} create <name> <url> [width height] &7- image screen"
    video: "&f/{label} video <name> <url> [width height] &7- video screen"
    url: "&f/{label} url <name> <url> &7- replace the source"
    refresh: "&f/{label} refresh <name> &7- download the source again"
    resize: "&f/{label} resize <name> <width> <height> [mode] &7- resize"
    scale: "&f/{label} scale <name> <factor> &7- scale the current size"
    aspect: "&f/{label} aspect <name> <preserve|free> &7- aspect ratio"
    resolution: "&f/{label} resolution <name> <width> [height]|auto &7- processing resolution"
    fps: "&f/{label} fps <name> <value> &7- video frame rate"
    play: "&f/{label} play|pause|stop|restart <name> &7- playback control"
    loop: "&f/{label} loop <name> <true|false> &7- loop the video"
    move: "&f/{label} move <name> [x y z [facing] [world]] &7- move the screen"
    rotate: "&f/{label} rotate <name> <0|90|180|270> &7- rotate the image"
    range: "&f/{label} range <name> <blocks> &7- view distance"
    hologram: "&f/{label} hologram <name> <true|false> &7- turn to face each player"
    remove: "&f/{label} remove <name> &7- remove the screen"
    list: "&f/{label} list &7- list the screens"
    info: "&f/{label} info <name> &7- screen details"
    reload: "&f/{label} reload &7- reload configuration and messages"
    web: "&f/{label} web [revoke] &7- temporary link to the upload panel"

list:
  header: "{prefix}&7Screens (&f{count}&7):"
  # {name} {type} {state} {world} {x} {y} {z} {width} {height}
  entry: " &8- &f{name} &7{type} {state} &8| &7{world} {x}, {y}, {z} &8| &7{width} x {height}"
  empty: "{prefix}&7There are no screens yet."

# {name} {type} {state} {url} {world} {x} {y} {z} {facing} {rotation} {width} {height} {box-width} {box-height}
# {columns} {rows} {maps} {source} {processing} {effective} {mode} {aspect} {fps} {loop} {range} {viewers} {error} {renderer}
info:
  - "&8&m-------&r &bScreen &f{name} &8&m-------"
  - "&7Type: &f{type} &7State: {state}"
  - "&7URL: &f{url}"
  - "&7Location: &f{world} {x}, {y}, {z} &7facing &f{facing} &7rotation &f{rotation}°"
  - "&7Virtual size: &f{width} x {height} &7blocks &8(requested {box-width} x {box-height})"
  - "&7Map grid: &f{columns} x {rows} &7({maps} maps, {renderer})"
  - "&7Source resolution: &f{source}"
  - "&7Processing resolution: &f{processing} &7(effective &f{effective}&7)"
  - "&7Fit mode: &f{mode} &7Aspect: &f{aspect}"
  - "&7FPS: &f{fps} &7Loop: &f{loop}"
  - "&7View distance: &f{range} &7Viewers: &f{viewers} &7Hologram: &f{hologram}"
  - "&7Last error: &f{error}"

states:
  loading: "&eloading"
  ready: "&aready"
  playing: "&aplaying"
  paused: "&epaused"
  stopped: "&7stopped"
  error: "&cerror"

types:
  image: "image"
  animation: "animated image ({frames} frames)"
  video: "video"

values:
  preserve: "preserve"
  free: "free"
  auto: "auto"
  unknown: "unknown"
  none: "none"
  "yes": "yes"
  "no": "no"

