# Mensagens do PacketScreen (Português do Brasil).
# Ative com language: pt_BR no config.yml.
# Cores usam & (por exemplo &a) e &#RRGGBB em servidores 1.16+ (versões antigas usam a cor legada mais próxima).

prefix: "&8[&bPacketScreen&8] &7"

no-permission: "{prefix}&cVocê não tem permissão para fazer isso."
players-only: "{prefix}&cSomente jogadores podem usar esta forma do comando. Informe coordenadas para usar pelo console."
unknown-command: "{prefix}&cSubcomando desconhecido. Use &f/{label} help&c."
cooldown: "{prefix}&cAguarde um momento antes de usar este comando novamente."

invalid-name: "{prefix}&cNome inválido &f{value}&c. Use de 1 a 32 letras, números, - ou _."
screen-exists: "{prefix}&cJá existe uma tela chamada &f{name}&c."
screen-overlap: "{prefix}&cEssa posição sobrepõe a tela &f{name}&c. Escolha outra posição ou mova essa tela antes."
source-is-video: "{prefix}&cEssa fonte é um vídeo. Use &f/{label} video {name} <url>&c para telas de vídeo."
source-is-image: "{prefix}&cEssa fonte é uma imagem. Use &f/{label} create {name} <url>&c para telas de imagem."
screen-not-found: "{prefix}&cA tela &f{name}&c não existe."
screen-limit: "{prefix}&cO limite de telas (&f{max}&c) foi atingido."
video-limit: "{prefix}&cO limite de vídeos simultâneos (&f{max}&c) foi atingido. Pare outro vídeo primeiro."
invalid-url: "{prefix}&cURL inválida. Use um link direto http:// ou https:// para o arquivo."
invalid-number: "{prefix}&c&f{value}&c não é um número válido."
invalid-size: "{prefix}&cTamanho inválido &f{value}&c. Use um número positivo de blocos, por exemplo 4 ou 2,25."
size-out-of-bounds: "{prefix}&cO tamanho deve ficar entre &f{min}&c e &f{max-width} x {max-height}&c blocos."
invalid-fit-mode: "{prefix}&cModo de ajuste inválido &f{value}&c. Use FIT, FILL ou STRETCH."
invalid-aspect: "{prefix}&cUse &fpreserve&c ou &ffree&c."
invalid-resolution: "{prefix}&cResolução inválida. Use uma largura, largura e altura, ou &fauto&c."
resolution-out-of-bounds: "{prefix}&cA resolução de processamento deve ficar entre &f16 x 16&c e &f{max-width} x {max-height}&c."
invalid-fps: "{prefix}&cO FPS deve ser um número inteiro entre &f1&c e &f{max}&c."
invalid-boolean: "{prefix}&cUse &ftrue&c ou &ffalse&c."
invalid-rotation: "{prefix}&cA rotação deve ser &f0&c, &f90&c, &f180&c ou &f270&c."
invalid-facing: "{prefix}&cDireção inválida &f{value}&c. Use north, south, east, west, up ou down."
invalid-range: "{prefix}&cO alcance deve ficar entre &f4&c e &f{max}&c blocos."
invalid-world: "{prefix}&cO mundo &f{value}&c não existe."
world-required: "{prefix}&cÉ preciso informar o nome do mundo ao usar o comando pelo console."
no-target-block: "{prefix}&cOlhe para um bloco sólido a até &f{distance}&c blocos ou informe coordenadas."
compatibility-error: "{prefix}&cEsta versão do servidor (&f{version}&c) não suporta {feature}."
not-a-video: "{prefix}&cA tela &f{name}&c não é uma tela de vídeo."

screen-created: "{prefix}&aTela de imagem &f{name}&a criada. Carregando a imagem..."
video-created: "{prefix}&aTela de vídeo &f{name}&a criada."
image-ready: "{prefix}&aA tela &f{name}&a está pronta: &f{source}&a exibida em &f{width} x {height}&a blocos."
animation-ready: "{prefix}&aA tela &f{name}&a está pronta: animação &f{source}&a com &f{frames}&a quadros tocando em &f{width} x {height}&a blocos."
load-failed: "{prefix}&cNão foi possível carregar a imagem de &f{name}&c: {reason}"
screen-removed: "{prefix}&aTela &f{name}&a removida."
resized: "{prefix}&aTela &f{name}&a redimensionada para &f{width} x {height}&a blocos (&f{mode}&a)."
scaled: "{prefix}&aTela &f{name}&a escalada em &f{factor}&a para &f{width} x {height}&a blocos."
aspect-preserve: "{prefix}&aA tela &f{name}&a agora preserva a proporção original."
aspect-free: "{prefix}&aA tela &f{name}&a agora usa largura e altura livres."
resolution-set: "{prefix}&aResolução de processamento de &f{name}&a definida para &f{width} x {height}&a pixels."
resolution-auto: "{prefix}&aA resolução de processamento de &f{name}&a agora é automática."
fps-set: "{prefix}&aFPS de &f{name}&a definido para &f{fps}&a."
loop-set: "{prefix}&aLoop de &f{name}&a definido para &f{loop}&a."
moved: "{prefix}&aTela &f{name}&a movida para &f{world} {x}, {y}, {z}&a voltada para &f{facing}&a."
rotated: "{prefix}&aTela &f{name}&a girada para &f{rotation}&a graus."
range-set: "{prefix}&aAlcance de &f{name}&a definido para &f{range}&a blocos."
hologram-set: "{prefix}&aModo holograma de &f{name}&a: &f{value}&a. A tela vira de frente para cada jogador."
url-changed: "{prefix}&aFonte de &f{name}&a alterada. Carregando..."
refreshing: "{prefix}&aRecarregando a fonte de &f{name}&a..."

video-loading: "{prefix}&eBaixando e preparando o vídeo de &f{name}&e..."
video-started: "{prefix}&aO vídeo &f{name}&a está tocando (&f{source}&a a &f{fps}&a FPS)."
video-paused: "{prefix}&eVídeo &f{name}&e pausado."
video-resumed: "{prefix}&aVídeo &f{name}&a retomado."
video-stopped: "{prefix}&7Vídeo &f{name}&7 interrompido."
video-restarted: "{prefix}&aVídeo &f{name}&a reiniciado."
video-ended: "{prefix}&7O vídeo &f{name}&7 chegou ao fim."
video-not-playing: "{prefix}&cO vídeo &f{name}&c não está tocando."
video-already-playing: "{prefix}&cO vídeo &f{name}&c já está tocando."
video-failed: "{prefix}&cNão foi possível reproduzir o vídeo de &f{name}&c: {reason}"
ffmpeg-missing: "{prefix}&cO FFmpeg não foi encontrado em &f{path}&c. Instale o FFmpeg ou ajuste video.ffmpeg-path no config.yml."

upload-not-found: "{prefix}&cO upload &f{value}&c não existe. Envie arquivos pelo painel web com /{label} web."
web-disabled: "{prefix}&cO painel web está desativado. Defina web.enabled como true no config.yml e use /{label} reload."
web-unavailable: "{prefix}&cO painel web requer Java 17 ou mais recente. Este servidor usa Java {java}."
web-not-running: "{prefix}&cO painel web não está em execução ({error}). Verifique o console e as opções web do config.yml."
web-link: "{prefix}&aLink do painel web (uso único, válido por {minutes} min): &f&n{url}"
web-revoked: "{prefix}&aTodos os links e sessões do painel web foram revogados."

reload-done: "{prefix}&aConfigurações e mensagens recarregadas."
reload-failed: "{prefix}&cNão foi possível recarregar as configurações: &f{error}"

features:
  floor-screens: "telas no chão e no teto (requer 1.13 ou mais recente)"

reasons:
  invalid-url: "a URL não é válida"
  blocked-address: "o endereço não é permitido"
  network: "erro de rede ({detail})"
  timeout: "a requisição excedeu o tempo limite"
  too-large: "o arquivo é maior que {max}"
  http-status: "o servidor respondeu HTTP {status}"
  too-many-redirects: "redirecionamentos demais"
  web-page: "a URL aponta para uma página web, não para um arquivo direto"
  unsupported-format: "o formato não é suportado"
  frames: "a animação tem {frames} quadros, o limite é {max}"
  video-source: "o arquivo é um vídeo, use o comando video"
  image-source: "o arquivo é uma imagem, use o comando create"
  resolution: "a resolução {width} x {height} está acima do limite"
  duration: "o vídeo tem mais de {max} segundos"
  decode: "o arquivo não pôde ser decodificado"
  ffmpeg-missing: "o FFmpeg não está disponível"
  map-ids: "não há ids de mapa livres (aumente o intervalo rendering.map-id)"
  missing: "o arquivo enviado não existe mais"
  storage-full: "o armazenamento de uploads está cheio ({max})"
  cancelled: "a operação foi cancelada"
  internal: "erro interno ({detail})"

usage:
  create: "{prefix}&eUso: &f/{label} create <nome> <url> [largura altura] [x y z [direção] [mundo]]"
  video: "{prefix}&eUso: &f/{label} video <nome> <url> [largura altura] [x y z [direção] [mundo]]"
  url: "{prefix}&eUso: &f/{label} url <nome> <url>"
  refresh: "{prefix}&eUso: &f/{label} refresh <nome>"
  resize: "{prefix}&eUso: &f/{label} resize <nome> <largura> <altura> [FIT|FILL|STRETCH]"
  scale: "{prefix}&eUso: &f/{label} scale <nome> <fator>"
  aspect: "{prefix}&eUso: &f/{label} aspect <nome> <preserve|free>"
  resolution: "{prefix}&eUso: &f/{label} resolution <nome> <largura> [altura] &7ou &f/{label} resolution <nome> auto"
  fps: "{prefix}&eUso: &f/{label} fps <nome> <valor>"
  play: "{prefix}&eUso: &f/{label} play <nome>"
  pause: "{prefix}&eUso: &f/{label} pause <nome>"
  stop: "{prefix}&eUso: &f/{label} stop <nome>"
  restart: "{prefix}&eUso: &f/{label} restart <nome>"
  loop: "{prefix}&eUso: &f/{label} loop <nome> <true|false>"
  hologram: "{prefix}&eUso: &f/{label} hologram <nome> <true|false>"
  move: "{prefix}&eUso: &f/{label} move <nome> [x y z [direção] [mundo]]"
  rotate: "{prefix}&eUso: &f/{label} rotate <nome> <0|90|180|270>"
  range: "{prefix}&eUso: &f/{label} range <nome> <blocos>"
  remove: "{prefix}&eUso: &f/{label} remove <nome>"
  list: "{prefix}&eUso: &f/{label} list"
  info: "{prefix}&eUso: &f/{label} info <nome>"
  reload: "{prefix}&eUso: &f/{label} reload"
  web: "{prefix}&eUso: &f/{label} web &7ou &f/{label} web revoke"

help:
  header: "&8&m-------&r &bPacketScreen &7v{version} &8&m-------"
  footer: "&7Tamanhos em blocos, podendo ser fracionados. A tela é ancorada no bloco inferior esquerdo."
  commands:
    create: "&f/{label} create <nome> <url> [largura altura] &7- tela de imagem"
    video: "&f/{label} video <nome> <url> [largura altura] &7- tela de vídeo"
    url: "&f/{label} url <nome> <url> &7- troca a fonte"
    refresh: "&f/{label} refresh <nome> &7- baixa a fonte novamente"
    resize: "&f/{label} resize <nome> <largura> <altura> [modo] &7- redimensiona"
    scale: "&f/{label} scale <nome> <fator> &7- escala o tamanho atual"
    aspect: "&f/{label} aspect <nome> <preserve|free> &7- proporção"
    resolution: "&f/{label} resolution <nome> <largura> [altura]|auto &7- resolução de processamento"
    fps: "&f/{label} fps <nome> <valor> &7- taxa de quadros do vídeo"
    play: "&f/{label} play|pause|stop|restart <nome> &7- controle de reprodução"
    loop: "&f/{label} loop <nome> <true|false> &7- repetir o vídeo"
    move: "&f/{label} move <nome> [x y z [direção] [mundo]] &7- move a tela"
    rotate: "&f/{label} rotate <nome> <0|90|180|270> &7- gira a imagem"
    range: "&f/{label} range <nome> <blocos> &7- alcance de visualização"
    hologram: "&f/{label} hologram <nome> <true|false> &7- vira de frente para cada jogador"
    remove: "&f/{label} remove <nome> &7- remove a tela"
    list: "&f/{label} list &7- lista as telas"
    info: "&f/{label} info <nome> &7- detalhes da tela"
    reload: "&f/{label} reload &7- recarrega configurações e mensagens"
    web: "&f/{label} web [revoke] &7- link temporário para o painel de upload"

list:
  header: "{prefix}&7Telas (&f{count}&7):"
  entry: " &8- &f{name} &7{type} {state} &8| &7{world} {x}, {y}, {z} &8| &7{width} x {height}"
  empty: "{prefix}&7Ainda não há telas."

info:
  - "&8&m-------&r &bTela &f{name} &8&m-------"
  - "&7Tipo: &f{type} &7Estado: {state}"
  - "&7URL: &f{url}"
  - "&7Posição: &f{world} {x}, {y}, {z} &7direção &f{facing} &7rotação &f{rotation}°"
  - "&7Tamanho virtual: &f{width} x {height} &7blocos &8(solicitado {box-width} x {box-height})"
  - "&7Grade de mapas: &f{columns} x {rows} &7({maps} mapas, {renderer})"
  - "&7Resolução de origem: &f{source}"
  - "&7Resolução de processamento: &f{processing} &7(efetiva &f{effective}&7)"
  - "&7Modo de ajuste: &f{mode} &7Proporção: &f{aspect}"
  - "&7FPS: &f{fps} &7Loop: &f{loop}"
  - "&7Alcance: &f{range} &7Espectadores: &f{viewers} &7Holograma: &f{hologram}"
  - "&7Último erro: &f{error}"

states:
  loading: "&ecarregando"
  ready: "&apronta"
  playing: "&atocando"
  paused: "&epausada"
  stopped: "&7parada"
  error: "&cerro"

types:
  image: "imagem"
  animation: "imagem animada ({frames} quadros)"
  video: "vídeo"

values:
  preserve: "preservada"
  free: "livre"
  auto: "automática"
  unknown: "desconhecida"
  none: "nenhum"
  "yes": "sim"
  "no": "não"

